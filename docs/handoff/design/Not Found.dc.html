<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="design-system/styles.css" rel="stylesheet"></link><style>a{color:var(--accent);text-decoration:none}a:hover{color:var(--text);text-decoration:underline}button{font:inherit}</style></helmet>
<div data-theme="{{ theme }}" style="container-type:inline-size;background:var(--bg);color:var(--text);font-family:var(--font-sans);width:100%">
<header style="background:var(--bg);border-bottom:var(--border-ink)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px clamp(20px,4cqi,48px)">
<a href="#" aria-label="fmyers.dev home" style="display:flex;flex:none"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><img src="assets/wordmark-light.svg" alt="fmyers.dev" style="height:24px;display:block"></img></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><img src="assets/wordmark-dark.svg" alt="fmyers.dev" style="height:24px;display:block"></img></sc-if></a>
<sc-if value="{{ isDesk }}" hint-placeholder-val="{{ true }}"><nav style="display:flex;gap:22px;font-family:var(--font-mono);font-size:13px;letter-spacing:1px;white-space:nowrap"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="5"><a href="#" style="display:flex;gap:6px;color:var(--text);text-decoration:none;padding:4px 0"><span style="color:var(--text-muted)">{{ n.id }}</span>{{ n.label }}</a></sc-for></nav></sc-if>
<div style="display:flex;gap:10px;align-items:center;flex:none">
<sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}"><div style="display:flex;border:var(--border-ink)"><span style="font-family:var(--font-mono);font-size:12px;padding:7px 10px;background:{{ enBg }};color:{{ enFg }}">EN</span><span style="font-family:var(--font-mono);font-size:12px;padding:7px 10px;background:{{ esBg }};color:{{ esFg }}">ES</span></div><button aria-label="Toggle theme" style="font-family:var(--font-mono);font-size:14px;width:34px;height:34px;border:var(--border-ink);background:transparent;color:var(--text);cursor:pointer">◐</button></sc-if>
<sc-if value="{{ notDesk }}" hint-placeholder-val="{{ false }}"><button style="font-family:var(--font-mono);font-size:13px;letter-spacing:1px;min-height:44px;padding:0 14px;border:var(--border-ink);background:transparent;color:var(--text);cursor:pointer">{{ c.menu }}</button></sc-if>
</div>
</div>
</header>
<main style="max-width:1280px;margin:0 auto;padding:clamp(24px,4cqi,48px) clamp(20px,4cqi,48px) clamp(56px,8cqi,96px);display:flex;flex-direction:column;gap:24px">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px;letter-spacing:1px;border-bottom:var(--border-ink);padding-bottom:10px"><span>{{ c.sheet }}</span><span style="color:var(--text-muted)">{{ c.path }}</span></div>
<section data-screen-label="404 · Sheet" style="position:relative;border:var(--border-frame);min-height:clamp(380px,42cqi,520px);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,4cqi,48px);gap:16px">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%;color:var(--text-muted)"><path ref="{{ a }}" d="M0 0L100 100" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:0"></path><path ref="{{ b }}" d="M100 0L0 100" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:0"></path></svg>
<span style="position:relative;align-self:flex-start;background:var(--bg);padding:2px 6px;font-family:var(--font-mono);font-size:13px;letter-spacing:1.5px;color:var(--accent)">404 · {{ c.missing }}</span>
<h1 style="position:relative;align-self:flex-start;background:var(--bg);padding:0 6px;margin:0;font-stretch:110%;font-weight:700;font-size:clamp(36px,5.6cqi,72px);letter-spacing:-0.035em;line-height:1;max-width:820px;text-wrap:balance">{{ c.h1 }}</h1>
<p style="position:relative;align-self:flex-start;background:var(--bg);padding:2px 6px;margin:0;font-size:17px;line-height:1.5;max-width:520px;text-wrap:pretty">{{ c.p }}</p>
<div style="position:relative;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
<a href="#" style="font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-fg);padding:16px 24px;text-decoration:none;white-space:nowrap">← {{ c.home }}</a>
<sc-for list="{{ links }}" as="l" hint-placeholder-count="2"><a href="#" style="font-family:var(--font-mono);font-size:13px;letter-spacing:1px;background:var(--bg);border:var(--border-ink);color:var(--text);padding:14px 16px;text-decoration:none" style-hover="color:var(--accent)">{{ l }} →</a></sc-for>
</div>
<div style="position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;background:var(--accent)"></div>
</section>
<button onClick="{{ replay }}" style="align-self:flex-start;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;padding:8px 12px;border:var(--border-ink);background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap">{{ c.replay }}</button>
</main>
<footer style="border-top:var(--border-ink);padding:20px clamp(20px,4cqi,48px);display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--text-muted)"><span>FMYERS.DEV · REV 2026.10</span><span>© 2026 · {{ c.langName }}</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;bp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'tablet'|'mobile'&quot;}}">
const COPY = {
  en: { menu: 'MENU', sheet: 'SHEET 404', path: '/en/wrok', missing: 'NOT FOUND', h1: "This sheet isn't in the set.", p: 'The link may be old or mistyped. Everything that exists is one click away.', home: 'Back home', links: ['WORK', 'CONTACT'], replay: 'REPLAY STROKES (DESIGN ONLY)', langName: 'ENGLISH' },
  es: { menu: 'MENÚ', sheet: 'LÁMINA 404', path: '/es/proyetos', missing: 'NO ENCONTRADA', h1: 'Esta lámina no está en el juego.', p: 'El enlace puede ser antiguo o tener un error. Todo lo que existe está a un clic.', home: 'Volver al inicio', links: ['PROYECTOS', 'CONTACTO'], replay: 'REPETIR TRAZOS (SOLO DISEÑO)', langName: 'ESPAÑOL' }
};
class Component extends DCLogic {
  a = React.createRef(); b = React.createRef();
  componentDidMount() { setTimeout(this.play, 300); }
  play = () => {
    const r = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    [this.a, this.b].forEach((x, i) => x.current && x.current.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: r ? 0 : 600, delay: r ? 0 : i * 120, easing: 'cubic-bezier(0.65,0,0.35,1)', fill: 'backwards' }));
  };
  renderVals() {
    const lang = this.props.lang === 'es' ? 'es' : 'en', es = lang === 'es', c = COPY[lang];
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const bp = this.props.bp || 'desktop', isDesk = bp === 'desktop';
    const on = { bg: 'var(--invert-bg)', fg: 'var(--invert-fg)' }, off = { bg: 'transparent', fg: 'var(--text)' };
    const navL = es ? ['SERVICIOS', 'PROYECTOS', 'SOBRE MÍ', 'PRECIOS', 'CONTACTO'] : ['SERVICES', 'WORK', 'ABOUT', 'PRICING', 'CONTACT'];
    return {
      c, theme, isLight: theme === 'light', isDark: theme === 'dark', isDesk, notDesk: !isDesk, notMobile: bp !== 'mobile',
      enBg: es ? off.bg : on.bg, enFg: es ? off.fg : on.fg, esBg: es ? on.bg : off.bg, esFg: es ? on.fg : off.fg,
      nav: navL.map((label, i) => ({ id: '0' + (i + 1), label })), links: c.links, a: this.a, b: this.b, replay: this.play
    };
  }
}
</script>
</body>
</html>
