<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="design-system/styles.css" rel="stylesheet"></link><style>a{color:var(--accent);text-decoration:none}a:hover{color:var(--text);text-decoration:underline}button{font:inherit}</style></helmet>
<div data-theme="{{ theme }}" style="container-type:inline-size;background:var(--bg);color:var(--text);font-family:var(--font-sans);width:100%">
<header style="background:var(--bg);border-bottom:var(--border-ink)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px clamp(20px,4cqi,48px)">
<a href="#" aria-label="fmyers.dev home" style="display:flex;flex:none"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><img src="assets/wordmark-light.svg" alt="fmyers.dev" style="height:24px;display:block"></img></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><img src="assets/wordmark-dark.svg" alt="fmyers.dev" style="height:24px;display:block"></img></sc-if></a>
<sc-if value="{{ isDesk }}" hint-placeholder-val="{{ true }}"><nav style="display:flex;gap:22px;font-family:var(--font-mono);font-size:13px;letter-spacing:1px;white-space:nowrap"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="5"><a href="#" style="display:flex;gap:6px;color:var(--text);text-decoration:none;padding:4px 0"><span style="color:var(--text-muted)">{{ n.id }}</span>{{ n.label }}</a></sc-for></nav></sc-if>
<div style="display:flex;gap:10px;align-items:center;flex:none">
<sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}"><div style="display:flex;border:var(--border-ink)"><span style="font-family:var(--font-mono);font-size:12px;padding:7px 10px;background:{{ enBg }};color:{{ enFg }}">EN</span><span style="font-family:var(--font-mono);font-size:12px;padding:7px 10px;background:{{ esBg }};color:{{ esFg }}">ES</span></div><button aria-label="Toggle theme" style="font-family:var(--font-mono);font-size:14px;width:34px;height:34px;border:var(--border-ink);background:transparent;color:var(--text);cursor:pointer">◐</button></sc-if>
<sc-if value="{{ notDesk }}" hint-placeholder-val="{{ false }}"><button style="font-family:var(--font-mono);font-size:13px;letter-spacing:1px;min-height:44px;padding:0 14px;border:var(--border-ink);background:transparent;color:var(--text);cursor:pointer">{{ c.menu }}</button></sc-if>
</div>
</div>
</header>
<main style="max-width:1280px;margin:0 auto;padding:clamp(24px,4cqi,48px) clamp(20px,4cqi,48px) clamp(56px,8cqi,96px);display:flex;flex-direction:column;gap:24px">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px;letter-spacing:1px;border-bottom:var(--border-ink);padding-bottom:10px"><span>{{ c.sheet }}</span><span style="color:var(--text-muted)">{{ c.updated }} 2026-10-06</span></div>
<article data-screen-label="Privacy · Prose" style="max-width:680px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-stretch:110%;font-weight:700;font-size:clamp(40px,5.6cqi,72px);letter-spacing:-0.035em;line-height:0.95">{{ c.h1 }}</h1>
<p style="margin:0;font-size:clamp(17px,1.5cqi,19px);line-height:1.5;color:var(--text-muted);text-wrap:pretty">{{ c.intro }}</p>
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="7"><section style="display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:var(--border-rule)">
<div style="display:flex;gap:12px;align-items:baseline"><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--accent)">{{ s.n }}</span><h2 style="margin:0;font-stretch:110%;font-weight:700;font-size:clamp(21px,2cqi,24px);letter-spacing:-0.3px">{{ s.h }}</h2></div>
<p style="margin:0;font-size:17px;line-height:1.65;text-wrap:pretty">{{ s.p }}</p>
</section></sc-for>
<a href="mailto:hola@fmyers.dev" style="align-self:flex-start;margin-top:8px;font-family:var(--font-mono);font-size:13px;letter-spacing:1px;border:var(--border-ink);color:var(--text);padding:14px 16px;text-decoration:none" style-hover="color:var(--accent)">HOLA@FMYERS.DEV →</a>
</article>
</main>
<footer style="border-top:var(--border-ink);padding:20px clamp(20px,4cqi,48px);display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--text-muted)"><span>FMYERS.DEV · REV 2026.10</span><span style="display:flex;gap:20px;flex-wrap:wrap"><a href="https://github.com/Solideomyers">GITHUB ↗</a><a href="https://linkedin.com/in/franciscomyers">LINKEDIN ↗</a><a href="https://wa.me/584249080683">WHATSAPP ↗</a></span><span>© 2026 · {{ c.langName }}</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;bp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;tablet&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'tablet'|'mobile'&quot;}}">
const COPY = {
  en: { menu: 'MENU', sheet: 'SHEET 08 — PRIVACY', updated: 'UPDATED', h1: 'Privacy', langName: 'ENGLISH',
    intro: 'This site belongs to Francisco Myers (fmyers.dev). This page explains what data it collects and what happens to it.',
    s: [['What the contact form collects', 'Your name, email, project type, budget range (optional) and message. Nothing else is required.'], ['Where it goes', 'The form sends your message to a Google Apps Script that stores it in a private Google Sheet and notifies me by email. Only I have access. I use it to reply to you and to prepare a proposal, never for marketing lists, and I never sell or share it.'], ['How long I keep it', 'Up to 24 months after our last conversation. Then I delete it. If we work together, project records are kept as long as the law requires for invoicing.'], ['Spam protection', 'The form uses Cloudflare Turnstile to check that a person is sending it. Cloudflare processes technical signals from your browser for that check only.'], ['Analytics and cookies', 'The site uses cookieless analytics that count visits in aggregate. It does not identify you or follow you across sites. There are no advertising or tracking cookies. Your theme and language choice is saved in your own browser and never sent to me.'], ['Hosting', 'The site is hosted on Vercel, which keeps short-lived server logs (such as IP address) for security and operation.'], ['Your rights', 'Write to hola@fmyers.dev to see, correct or delete the data I hold about you. I reply within 2 business days.']] },
  es: { menu: 'MENÚ', sheet: 'LÁMINA 08 — PRIVACIDAD', updated: 'ACTUALIZADO', h1: 'Privacidad', langName: 'ESPAÑOL',
    intro: 'Este sitio pertenece a Francisco Myers (fmyers.dev). Esta página explica qué datos recoge y qué pasa con ellos.',
    s: [['Qué recoge el formulario de contacto', 'Tu nombre, email, tipo de proyecto, rango de presupuesto (opcional) y mensaje. No se pide nada más.'], ['A dónde van', 'El formulario envía tu mensaje a un Google Apps Script que lo guarda en una hoja de Google privada y me avisa por correo. Solo yo tengo acceso. Lo uso para responderte y preparar una propuesta, nunca para listas de marketing, y nunca lo vendo ni lo comparto.'], ['Cuánto tiempo lo guardo', 'Hasta 24 meses después de nuestra última conversación. Luego lo borro. Si trabajamos juntos, los registros del proyecto se guardan el tiempo que exija la ley para la facturación.'], ['Protección contra spam', 'El formulario usa Cloudflare Turnstile para comprobar que lo envía una persona. Cloudflare procesa señales técnicas de tu navegador solo para esa comprobación.'], ['Analítica y cookies', 'El sitio usa analítica sin cookies que cuenta visitas de forma agregada. No te identifica ni te sigue entre sitios. No hay cookies de publicidad ni de rastreo. Tu elección de tema e idioma se guarda en tu propio navegador y nunca me llega.'], ['Hosting', 'El sitio está alojado en Vercel, que guarda registros de servidor de corta duración (como la dirección IP) por seguridad y funcionamiento.'], ['Tus derechos', 'Escribe a hola@fmyers.dev para ver, corregir o borrar los datos que tengo sobre ti. Respondo en 2 días hábiles.']] }
};
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang === 'es' ? 'es' : 'en', es = lang === 'es', c = COPY[lang];
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const bp = this.props.bp || 'desktop', isDesk = bp === 'desktop';
    const on = { bg: 'var(--invert-bg)', fg: 'var(--invert-fg)' }, off = { bg: 'transparent', fg: 'var(--text)' };
    const navL = es ? ['SERVICIOS', 'PROYECTOS', 'SOBRE MÍ', 'PRECIOS', 'CONTACTO'] : ['SERVICES', 'WORK', 'ABOUT', 'PRICING', 'CONTACT'];
    return {
      c, theme, isLight: theme === 'light', isDark: theme === 'dark', isDesk, notDesk: !isDesk, notMobile: bp !== 'mobile',
      enBg: es ? off.bg : on.bg, enFg: es ? off.fg : on.fg, esBg: es ? on.bg : off.bg, esFg: es ? on.fg : off.fg,
      nav: navL.map((label, i) => ({ id: '0' + (i + 1), label })),
      sections: c.s.map(([h, p], i) => ({ n: '0' + (i + 1), h, p }))
    };
  }
}
</script>
</body>
</html>
