name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint:check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check

  # main only receives a release/vX.Y.Z branch that points exactly at the develop commit tagged
  # vX.Y.Z, merged with a merge commit (ruleset). main then contains develop's real history:
  # no squash divergence, no back-merges, no false conflicts on the next release.
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Release branch, title and tag agree
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PRs into main come from release/vX.Y.Z (got $HEAD_REF)"; exit 1; }
          VERSION="${HEAD_REF#release/}"
          [[ "$TITLE" == "chore: release $VERSION" ]] || { echo "::error::The release PR title must be 'chore: release $VERSION'"; exit 1; }
          git fetch --force --tags origin develop
          # The tag does not exist yet (tag.yml creates it when this PR is merged) and must be the highest.
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null && { echo "::error::Tag $VERSION already exists: pick the next version"; exit 1; }
          HIGHEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          [[ -z "$HIGHEST" || "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" == "$VERSION" ]] || { echo "::error::$VERSION must be greater than the highest tag $HIGHEST"; exit 1; }
          # A commit already on develop, with no commits of its own on the release branch.
          git merge-base --is-ancestor "$HEAD_SHA" origin/develop || { echo "::error::$HEAD_REF has commits that are not on develop (fix on develop, then re-cut the release)"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-blog-hidden.mjs

  # The admin panel is its own npm project (lint is covered by the root lint job). Its unit tests run
  # under Node and import ../src/lib (zod, yaml), which Node resolves from the root, so the root is
  # installed too. The Vite build needs only admin/node_modules (resolve.dedupe + tsconfig paths).
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: npm test
        working-directory: admin

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
