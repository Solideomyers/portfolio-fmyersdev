name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint:check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check

  # main only receives a release/vX.Y.Z branch that points exactly at the develop commit tagged
  # vX.Y.Z, merged with a merge commit (ruleset). main then contains develop's real history:
  # no squash divergence, no back-merges, no false conflicts on the next release.
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Release branch, title and tag agree
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::PRs into main come from release/vX.Y.Z (got $HEAD_REF)"; exit 1; }
          VERSION="${HEAD_REF#release/}"
          [[ "$TITLE" == "chore: release $VERSION" ]] || { echo "::error::The release PR title must be 'chore: release $VERSION'"; exit 1; }
          git fetch --force --tags origin develop
          TAGGED="$(git rev-parse "refs/tags/$VERSION^{commit}" 2>/dev/null)" || { echo "::error::Tag $VERSION does not exist (tag.yml creates it on merge to develop)"; exit 1; }
          [[ "$TAGGED" == "$HEAD_SHA" ]] || { echo "::error::$HEAD_REF must point at the commit tagged $VERSION on develop, with no commits of its own (fix on develop, then re-cut the release)"; exit 1; }
          git merge-base --is-ancestor "$HEAD_SHA" origin/develop || { echo "::error::$VERSION is not on develop"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-blog-hidden.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
