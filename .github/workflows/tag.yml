name: Auto-tag

# A tag marks what was released, not every merge: it is created when a release/vX.Y.Z PR is merged
# into main, on the develop commit that PR promoted (the release branch tip, the merge's 2nd parent).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag the released develop commit (annotated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR that produced this push names the version: its head branch is release/vX.Y.Z.
          HEAD_REF="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].head.ref // empty')"
          if [[ ! "$HEAD_REF" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Not a release merge (PR head: '${HEAD_REF}'): nothing to tag"
            exit 0
          fi
          VERSION="${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already exists: skipped"
            exit 0
          fi
          # A merge commit: parent 1 is main before, parent 2 the released develop commit.
          SOURCE="$(git rev-parse "${GITHUB_SHA}^2")"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$VERSION" "$SOURCE" -m "$VERSION — $(git log -1 --format=%s "$SOURCE")"
          git push origin "$VERSION"
