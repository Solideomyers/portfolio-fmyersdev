name: Auto-tag

on:
  push:
    branches: [develop]

permissions:
  contents: write

# Serialise runs so two close merges can't compute the same tag.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag next v0.N.0 (annotated, canonical)
        run: |
          if git tag --points-at HEAD | grep -q '^v0\.'; then
            echo "HEAD already tagged: $(git tag --points-at HEAD)"
            exit 0
          fi
          LAST=$(git tag --list 'v0.*.0' --sort=-v:refname | head -n1)
          LAST=${LAST:-v0.0.0}
          MINOR=$(echo "$LAST" | sed -E 's/^v0\.([0-9]+)\.0$/\1/')
          NEXT="v0.$((MINOR + 1)).0"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$NEXT" -m "$NEXT — $(git log -1 --format=%s)"
          git push origin "$NEXT"
